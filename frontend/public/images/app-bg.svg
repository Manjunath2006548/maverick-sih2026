<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="55%" stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="20%" cy="15%" r="70%">
      <stop offset="0%" stop-color="#1a3a6b" stop-opacity="0.5"/>
      <stop offset="55%" stop-color="#13294a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a1122" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trace" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#4da6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4da6ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#4da6ff" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="radar" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.05"/>
      <stop offset="85%" stop-color="#2dd4bf" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4da6ff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="1080" fill="url(#bg)"/>
  <rect width="1600" height="1080" fill="url(#coreGlow)"/>
  <rect width="1600" height="1080" fill="url(#grid)"/>

  <!-- Live monitoring sparklines (burn-in trend monitors) -->
  <g fill="none" stroke-width="2">
    <polyline stroke="#4da6ff" stroke-opacity="0.4" points="60,60 320,85 560,45 820,95 1080,55 1340,88 1540,60"/>
    <polyline stroke="#2dd4bf" stroke-opacity="0.35" points="60,120 300,105 600,140 900,100 1240,135 1540,110"/>
    <polyline stroke="#ff8b4d" stroke-opacity="0.4" points="60,170 260,150 520,190 900,160 1180,200 1540,175"/>
  </g>

  <!-- Radar / sweep monitor -->
  <g transform="translate(420,360)">
    <circle r="210" fill="url(#radar)"/>
    <circle r="210" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle r="140" fill="none" stroke="#2dd4bf" stroke-opacity="0.14" stroke-width="1"/>
    <circle r="70" fill="none" stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1"/>
    <g stroke="#2dd4bf" stroke-opacity="0.1" stroke-width="1">
      <line x1="-210" y1="0" x2="210" y2="0"/>
      <line x1="0" y1="-210" x2="0" y2="210"/>
    </g>
    <line x1="0" y1="0" x2="150" y2="-148" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="150" cy="-148" r="4" fill="#2dd4bf" opacity="0.8"/>
    <circle cx="-95" cy="62" r="3" fill="#4da6ff" opacity="0.5"/>
    <circle cx="38" cy="120" r="2.5" fill="#ff8b4d" opacity="0.6"/>
  </g>

  <!-- Bar chart (lot distribution) -->
  <g transform="translate(1050, 260)">
    <line x1="0" y1="180" x2="420" y2="180" stroke="#4da6ff" stroke-opacity="0.2" stroke-width="1.5"/>
    <rect x="12" y="120" width="34" height="60" fill="url(#barGrad)"/>
    <rect x="56" y="95" width="34" height="85" fill="url(#barGrad)"/>
    <rect x="100" y="60" width="34" height="120" fill="url(#barGrad)"/>
    <rect x="144" y="20" width="34" height="160" fill="url(#barGrad)"/>
    <rect x="188" y="55" width="34" height="125" fill="url(#barGrad)"/>
    <rect x="232" y="90" width="34" height="90" fill="url(#barGrad)"/>
    <rect x="276" y="130" width="34" height="50" fill="url(#barGrad)"/>
    <rect x="320" y="150" width="34" height="30" fill="url(#barGrad)"/>
    <rect x="144" y="20" width="34" height="4" fill="#ff8b4d" opacity="0.7"/>
  </g>

  <!-- Gauge (safety slope monitor) -->
  <g transform="translate(1230, 720)" fill="none">
    <path d="M -95 70 A 110 110 0 0 1 95 70" stroke="#4da6ff" stroke-opacity="0.25" stroke-width="1.5"/>
    <path d="M -95 70 A 110 110 0 0 1 -30 47" stroke="#ff8b4d" stroke-opacity="0.5" stroke-width="4" stroke-linecap="round"/>
    <path d="M -95 70 L 0 -30 L 95 70 Z" stroke="#4da6ff" stroke-opacity="0.08" stroke-width="1.5"/>
    <line x1="0" y1="70" x2="0" y2="-45" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="3"/>
    <circle r="5" fill="#2dd4bf" opacity="0.8"/>
  </g>

  <!-- Circuit traces -->
  <g fill="none" stroke="url(#trace)" stroke-width="2">
    <path d="M -40 820 L 240 820 L 290 770 L 520 770 L 570 730 L 760 730"/>
    <path d="M 800 730 L 850 780 L 1040 780"/>
    <path d="M 1180 820 L 1260 820 L 1320 760 L 1600 760"/>
    <path d="M 520 770 L 520 640 L 660 640 L 660 560"/>
    <path d="M 760 730 L 760 620 L 900 620 L 900 540"/>
    <path d="M -30 920 L 160 920 L 210 870 L 460 870 L 510 920 L 720 920"/>
    <path d="M 880 920 L 930 870 L 1180 870 L 1230 920 L 1600 920"/>
  </g>
  <g fill="#4da6ff" opacity="0.3">
    <circle cx="290" cy="770" r="4"/><circle cx="520" cy="770" r="4"/>
    <circle cx="850" cy="780" r="4"/><circle cx="1260" cy="820" r="4"/>
    <circle cx="210" cy="870" r="4"/><circle cx="930" cy="870" r="4"/>
    <circle cx="660" cy="640" r="4"/>
  </g>

  <!-- Data droplets -->
  <g fill="#4da6ff" opacity="0.18">
    <circle cx="300" cy="560" r="3"/><circle cx="360" cy="505" r="2"/>
    <circle cx="430" cy="585" r="2.5"/><circle cx="700" cy="420" r="2"/>
    <circle cx="760" cy="470" r="3"/><circle cx="1550" cy="430" r="2.5"/>
  </g>

  <!-- corner accents -->
  <g fill="none" stroke="#4da6ff" stroke-opacity="0.12" stroke-width="1.5">
    <rect x="60" y="60" width="34" height="34" rx="3"/>
    <rect x="84" y="74" width="6" height="6"/>
    <rect x="1506" y="986" width="34" height="34" rx="3"/>
    <rect x="1506" y="986" width="10" height="10"/>
  </g>
</svg>